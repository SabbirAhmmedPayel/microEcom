version: '3.8'

services:
  # Database Service for login & products & payments
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: NewPassword123  # Make sure this matches .env in your services
      POSTGRES_DB: login_db              # Main DB
    ports:
      - "5432:5432"
    volumes:
      - ./back/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Backend Service
  backend:
    build: ./back
    ports:
      - "3000:3000"
    volumes:
      - ./back:/app
      - /app/node_modules
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: NewPassword123
      DB_NAME: login_db

  # Frontend Service
  frontend:
    build: ./front
    ports:
      - "8080:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - backend

  # Product Service
  product-service:
    build: ./product
    ports:
      - "4000:4000"
    volumes:
      - ./product:/app
      - /app/node_modules
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: NewPassword123
      DB_NAME: product_db

  # Payment Service (new)
  payment-service:
    build: ./payment
    container_name: payment-service
    ports:
      - "8000:8000"
    volumes:
      - ./payment:/app
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:NewPassword123@db:5432/payment_db
      JWT_SECRET: your_jwt_secret
