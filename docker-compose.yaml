version: '3.8'

services:
  # 1. Database Service
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: NewPassword123
      POSTGRES_DB: micro_db  # Using a unified DB name or ensure init.sql creates multiple
    ports:
      - "5432:5432"
    volumes:
      - ./back/init.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Backend Service (Node.js)
  backend:
    build: ./back
    ports:
      - "3000:3000"
    volumes:
      - ./back:/app
      - /app/node_modules
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: NewPassword123
      DB_NAME: micro_db
      JWT_SECRET: your_jwt_secret

  # 3. Product Service (FastAPI)
  product-service:
    build: ./product
    ports:
      - "4000:4000"
    volumes:
      - ./product:/app
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:NewPassword123@db:5432/micro_db
      JWT_SECRET: your_jwt_secret

  # 4. Order Service (FastAPI) - FIXED POSITION
  order:
    build: ./order
    ports:
      - "8002:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:NewPassword123@db:5432/micro_db
      JWT_SECRET: your_jwt_secret

  # 5. Frontend Service
  frontend:
    build: ./front
    ports:
      - "8080:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - backend
